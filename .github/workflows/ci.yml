# The drift gate: claims treated like SLOs.
# Every push, Windows + Linux, zero secrets: contract suite -> hygiene gate ->
# full regeneration -> `git diff --exit-code`. The committed artifacts ARE the
# claims; CI proves they regenerate.
name: drift-gate

on: [push, pull_request]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: byte-identity guarantees are version-scoped
      - name: install (runtime is stdlib-only; dev extra is pytest)
        run: pip install -e ".[dev]"
      - name: contract suite
        run: pytest -q
      - name: repo hygiene gate
        run: python tools/blocklist_check.py
      - name: regenerate every published artifact
        run: python -m mutationlab demo --quiet
      - name: fail on any drift between committed claims and the fresh run
        run: git diff --exit-code
