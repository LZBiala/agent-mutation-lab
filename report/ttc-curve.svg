<text x="584" y="233" fill="#6b7280" font-size="11">(no detection rule)</text>
<text x="70" y="414" fill="#dc2626">synthetic Bernoulli noise, independent BY CONSTRUCTION</text>
<text x="70" y="432" fill="#dc2626">a mechanism reproduced, never any model measured</text>
<text x="70" y="450" fill="#6b7280">the prediction is valid only above one-half member accuracy — A3 is the regime below it</text>
