<text x="584" y="186" fill="#111111" font-size="11">A3 below-chance</text>
<text x="584" y="199" fill="#6b7280" font-size="11">members</text>
<line x1="560" y1="216" x2="576" y2="216" stroke="#dc2626" stroke-width="3"/>
